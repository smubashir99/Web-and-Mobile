<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 5 – JavaScript Event Lifecycle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Lab 5 – JavaScript Event Lifecycle</h2>

    <!-- Page Load Message -->
    <p id="status">Loading...</p>

    <hr>

    <!-- Click Event -->
    <button id="btnClick">Click Me</button>
    <p id="clickMsg"></p>

    <hr>

    <!-- Input & Select -->
    <input id="nameInput" value="Select this text">
    <p id="inputMsg"></p>

    <hr>

    <!-- Form -->
    <form id="loginForm">
        <input type="email" required placeholder="Enter Email">
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>

    <p id="formMsg"></p>

    <script src="script.js"></script>
</body>
</html>
